name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Telegram-FOSS-Team/Telegram-FOSS
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleFatRelease --no-daemon -x lint

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: TMessagesProj/build/outputs/apk/**/*.apk
