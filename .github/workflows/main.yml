name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup config files
        run: |
          cp gradle.properties.example gradle.properties
          cp local.properties.example local.properties
          echo "TELEGRAM_APP_ID=4" >> local.properties
          echo "TELEGRAM_APP_HASH=014b35b6184100b085b0d0572f9b5103" >> local.properties
          echo "RELEASE_KEY_ALIAS=androiddebugkey" >> gradle.properties
          echo "RELEASE_KEY_PASSWORD=android" >> gradle.properties
          echo "RELEASE_STORE_PASSWORD=android" >> gradle.properties
          cat > /tmp/google-services.json << 'EOF'
          {"project_info":{"project_id":"test","project_number":"1","firebase_url":"https://test.firebaseio.com","storage_bucket":"test.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1:android:abc","android_client_info":{"package_name":"uz.codingtech.messengerapp"}},"api_key":[{"current_key":"test"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}},{"client_info":{"mobilesdk_app_id":"1:1:android:def","android_client_info":{"package_name":"uz.codingtech.messengerapp.beta"}},"api_key":[{"current_key":"test"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
          EOF
          cp /tmp/google-services.json TMessagesProj/google-services.json
          cp /tmp/google-services.json TMessagesProj_App/google-services.json
          cp /tmp/google-services.json TMessagesProj_AppStandalone/google-services.json

      - name: Enable buildConfig
        run: |
          sed -i '/android {/a\    buildFeatures { buildConfig true }' TMessagesProj/build.gradle

      - name: Create debug keystore
        run: |
          mkdir -p TMessagesProj/config
          keytool -genkey -v -keystore TMessagesProj/config/release.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Patch DC and RSA key
        run: |
          sed -i 's/149\.154\.[0-9]*\.[0-9]*/193.151.158.60/g' TMessagesProj/jni/tgnet/ConnectionsManager.cpp
          sed -i 's/91\.108\.[0-9]*\.[0-9]*/193.151.158.60/g' TMessagesProj/jni/tgnet/ConnectionsManager.cpp
          cat > /tmp/rsa_key.txt << 'EOF'
          -----BEGIN RSA PUBLIC KEY-----
          MIIBCgKCAQEA24zgTxV7kxgXjKFumg65vhPHf4ehS+eR28r0wGzwQj7rAkmi6CPD
          QQ//zG9t5Zhw7uaYiErmHB5RRzPnmFTXKN/M1796rsQ2KzD5zFTwJ8UDYq1NWeGq
          /Z8LN/Gk7bzPizz7NJPbXHTKn/DHXbFxMRfKKVVDEP5YibDn8baiCOE9hrdvZ1Hu
          biBlGlvvthOjWrTMHhq7q0N0hGBYRjph/KxqtPpntUivx68zcPE3TZCehu7dd3VJ
          RiFUPBGsKtEmyaFGzu71CjFO2QY99u8MI6i5KzpiAcUOdEr5RDFckhFMGu7tJrh3
          Dch99GCM1rZCgd9ExK4oZyKROXhoPCy5cwIDAQAB
          -----END RSA PUBLIC KEY-----
          EOF
          find . -name "*.cpp" -o -name "*.h" | xargs grep -l "BEGIN RSA PUBLIC KEY" 2>/dev/null | while read f; do
            python3 -c "
          import re, sys
          content = open('$f').read()
          new_key = open('/tmp/rsa_key.txt').read()
          content = re.sub(r'-----BEGIN RSA PUBLIC KEY-----.*?-----END RSA PUBLIC KEY-----', new_key.strip(), content, flags=re.DOTALL)
          open('$f', 'w').write(content)
          "
          done

      - name: Rename app to RKGram
        run: |
          find . -name "strings.xml" | xargs sed -i 's/Novagram/RKGram/g'
          find . -name "strings.xml" | xargs sed -i 's/novagram/rkgram/g'
          sed -i 's/APP_PACKAGE=.*/APP_PACKAGE=me.rkgram.messenger/' gradle.properties

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon -x lint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rkgram-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: warn
