name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleStandalone
      - uses: actions/upload-artifact@v3
        with:
          name: apk
          path: TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
