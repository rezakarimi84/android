name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Telegram-FOSS-Team/Telegram-FOSS
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix gradle properties
        run: sed -i 's/-XX:MaxPermSize=[0-9]*[mMgG]//' gradle.properties

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleStandalone --no-daemon -x lint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-apk
          path: TMessagesProj/build/outputs/apk/
          if-no-files-found: warn
