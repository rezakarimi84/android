name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DrKLO Telegram
        uses: actions/checkout@v4
        with:
          repository: DrKLO/Telegram
          
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleAfat
          
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: TMessagesProj/build/outputs/apk/**/*.apk
