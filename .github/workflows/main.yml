name: Build RKGram APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DrKLO Telegram
        uses: actions/checkout@v4
        with:
          repository: DrKLO/Telegram
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set API credentials
        run: |
          sed -i 's/int APP_ID = [0-9]*/int APP_ID = 33758413/' TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i 's/String APP_HASH = "[^"]*"/String APP_HASH = "e9fe420e4e170ff123fd27c3f63c440e"/' TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java

      - name: Patch DC address
        run: |
          find . -name "ConnectionsManager.cpp" | xargs sed -i 's/149\.154\.[0-9]*\.[0-9]*/193.151.158.60/g'
          find . -name "ConnectionsManager.cpp" | xargs sed -i 's/91\.108\.[0-9]*\.[0-9]*/193.151.158.60/g'

      - name: Rename to RKGram
        run: |
          find . -name "strings.xml" | xargs sed -i 's/>Telegram</>RKGram</g'

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleAfat --no-daemon -x lint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rkgram-apk
          path: TMessagesProj/build/outputs/apk/**/*.apk
          if-no-files-found: warn
