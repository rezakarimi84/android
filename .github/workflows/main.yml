name: Build RKGram APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache NDK build
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            TMessagesProj/.cxx
          key: ${{ runner.os }}-ndk-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-ndk-

      - name: Setup config files
        run: |
          cp gradle.properties.example gradle.properties
          cp local.properties.example local.properties
          echo "TELEGRAM_APP_ID=33758413" >> local.properties
          echo "TELEGRAM_APP_HASH=e9fe420e4e170ff123fd27c3f63c440e" >> local.properties
          echo "RELEASE_KEY_ALIAS=androiddebugkey" >> gradle.properties
          echo "RELEASE_KEY_PASSWORD=android" >> gradle.properties
          echo "RELEASE_STORE_PASSWORD=android" >> gradle.properties
          cat > /tmp/google-services.json << 'EOF'
          {"project_info":{"project_id":"rkgram","project_number":"1","firebase_url":"https://rkgram.firebaseio.com","storage_bucket":"rkgram.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1:android:abc","android_client_info":{"package_name":"me.rkgram.messenger"}},"api_key":[{"current_key":"test"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}},{"client_info":{"mobilesdk_app_id":"1:1:android:def","android_client_info":{"package_name":"me.rkgram.messenger.beta"}},"api_key":[{"current_key":"test"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
          EOF
          cp /tmp/google-services.json TMessagesProj/google-services.json
          cp /tmp/google-services.json TMessagesProj_App/google-services.json
          cp /tmp/google-services.json TMessagesProj_AppStandalone/google-services.json

      - name: Enable buildConfig
        run: |
          sed -i '/android {/a\    buildFeatures { buildConfig true }' TMessagesProj/build.gradle

      - name: Create debug keystore
        run: |
          mkdir -p TMessagesProj/config
          keytool -genkey -v -keystore TMessagesProj/config/release.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=RKGram,O=RK,C=IR"

      - name: Patch DC address
        run: |
          find . -name "ConnectionsManager.cpp" -exec sed -i 's/149\.154\.[0-9]*\.[0-9]*/193.151.158.60/g' {} \;
          find . -name "ConnectionsManager.cpp" -exec sed -i 's/91\.108\.[0-9]*\.[0-9]*/193.151.158.60/g' {} \;
          find . -name "Datacenter.cpp" -exec sed -i 's/149\.154\.[0-9]*\.[0-9]*/193.151.158.60/g' {} \;
          find . -name "Datacenter.cpp" -exec sed -i 's/91\.108\.[0-9]*\.[0-9]*/193.151.158.60/g' {} \;
          echo "=== Patched files ==="
          grep -r "193.151.158.60" . --include="*.cpp" -l

      - name: Replace RSA Key and Fingerprint
        run: |
          python3 - << 'EOF'
          import re
          new_key = ""
          new_fp = "0x9dbe5a4c45febeff"
          files = [
              "TMessagesProj/jni/tgnet/Handshake.cpp",
              "TMessagesProj/jni/tgnet/Datacenter.cpp"
          ]
          for f in files:
              with open(f, 'r') as file:
                  content = file.read()
              new_content = re.sub(r'MIIBCgKCAQEA[A-Za-z0-9+/=]+', new_key, content)
              new_content = re.sub(r'0x[0-9a-f]{16}', new_fp, new_content)
              with open(f, 'w') as file:
                  file.write(new_content)
              print(f"✅ Updated: {f}")
          EOF

      - name: Verify
        run: |
          echo "=== Key check ==="
          grep -o "MIIBCgKCAQEA[A-Za-z0-9+/=]*" TMessagesProj/jni/tgnet/Handshake.cpp | head -1
          echo "=== Fingerprint check ==="
          grep -o "0x[0-9a-f]*" TMessagesProj/jni/tgnet/Handshake.cpp | head -5

      - name: Rename to RKGram
        run: |
          find . -name "strings.xml" | xargs sed -i 's/Novagram/RKGram/g'
          find . -name "strings.xml" | xargs sed -i 's/novagram/rkgram/g'
          find . -name "*.kt" -o -name "*.java" | xargs grep -l "Novagram" 2>/dev/null | xargs sed -i 's/Novagram/RKGram/g' 2>/dev/null || true
          sed -i 's/APP_PACKAGE=.*/APP_PACKAGE=me.rkgram.messenger/' gradle.properties

      - name: Remove Nova Settings and Fix Version
        run: |
          python3 - << 'EOF'
          import re, os
          f = "TMessagesProj/src/main/java/org/telegram/ui/SettingsActivity.java"
          with open(f, 'r') as file:
              content = file.read()
          content = re.sub(r'\s*items\.add\(UItem\.asHeader\("RKGram"\)\);\n', '\n', content)
          content = re.sub(r'\s*items\.add\(UItem\.asHeader\("Novagram"\)\);\n', '\n', content)
          content = re.sub(r'\s*items\.add\(SettingCell\.Factory\.of\(10[0-6][^;]*\);\n', '\n', content)
          content = re.sub(r'\n\s*items\.add\(UItem\.asShadow\(null\)\);\n(\s*items\.add\(SettingCell\.Factory\.of\(1,)', r'\n\1', content)
          content = content.replace('"RKGram for Android v%s', '"RKGram v%s')
          with open(f, 'w') as file:
              file.write(content)
          print("✅ SettingsActivity updated")
          for root, dirs, files in os.walk('TMessagesProj/src/main/res'):
              for fname in files:
                  if fname == 'strings.xml':
                      path = os.path.join(root, fname)
                      with open(path, 'r') as file:
                          c = file.read()
                      c = c.replace('RKGram Beta', 'RKGram')
                      c = c.replace('Novagram Beta', 'RKGram')
                      with open(path, 'w') as file:
                          file.write(c)
          print("✅ Beta removed")
          EOF

      - name: Fix Version Name
        run: |
          sed -i 's/versionName "[^"]*"/versionName "1.2.0"/' TMessagesProj/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "1.2.0"/' TMessagesProj_App/build.gradle 2>/dev/null || true
          echo "=== Version check ==="
          grep "versionName" TMessagesProj/build.gradle | head -3

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon -x lint 2>&1 | tail -30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rkgram-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: warn
