name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix gradle properties
        run: |
          find . -name "gradle.properties" -exec sed -i 's/-XX:MaxPermSize=[0-9]*[mMgG]//' {} \;
          echo "APP_VERSION_NAME=1.0.0" >> TMessagesProj/gradle.properties
          echo "APP_VERSION_CODE=1" >> TMessagesProj/gradle.properties

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleStandalone --no-daemon -x lint

      - name: Find APK files
        run: find . -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-apk
          path: "**/*.apk"
          if-no-files-found: warn
